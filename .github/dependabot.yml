version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          # eslint-config-next 不带 @ 前缀，@next/* 匹配不到它——2026-10-13
          # 实测它曾停在 16.3.5 而 next 已 16.4.0（PR #52/#57）。
          - next
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      playwright:
        patterns:
          - playwright
          - "@playwright/test"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
