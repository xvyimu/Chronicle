name: Uptime

# 每 10 分钟探活生产站点。
#
# 为什么探两个 URL、判定表怎么定的：见 scripts/probe-health.ts 头部与
# docs/14-decision-log.md 的 D-039。两处写全在 YAML 里会与脚本漂移。
#
# 这里只留操作面：
#   - 结论由主探针（CF 域名）决定：连不上/5xx → down
#   - 辅探针（Vercel 别名）失败不改结论，只把原始结果写进 issue
#   - 403 挑战 / 429 限流 / 3xx 重定向都算 up
#   - down → 开 issue（已有 open issue 则追加评论，评论节流 1 小时）· up → 关 issue
#
# schedule 注册：GitHub 的 schedule 事件有时对「新合入 master 的 workflow」
# 注册延迟或失效（社区大量同类报告，官方建议推一个动到该文件的 commit 触发
# resync）。本注释行就是为此而存在——改动它即触发重新注册，不改逻辑。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手动触发，用于测试

permissions:
  contents: read
  issues: write # 探活失败时开 issue 需要

concurrency:
  group: uptime
  cancel-in-progress: false # 不取消：上一次还在跑说明站点慢，不该打断

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://incca.ccwu.cc' }}
      # Vercel 项目生产别名，绕过 Cloudflare 直连 origin。换域名/项目时改这里
      # 或设 repo variable。不要用 <project>-<hash>.vercel.app——每次部署都变。
      VERCEL_ORIGIN_URL: ${{ vars.VERCEL_ORIGIN_URL || 'https://blog-aijiai520.vercel.app' }}
    steps:
      - uses: actions/checkout@v7

      # Node 24 原生跑 .ts（type stripping），所以这个 job 不装 pnpm、不装依赖
      # ——每 10 分钟拉一次全量依赖不值得，探活脚本只用到 node: 内置模块。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Probe production health
        id: probe
        run: node scripts/probe-health.ts

      - name: Open issue if the site is down
        if: steps.probe.outputs.state == 'down'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'uptime';
            // 故障持续期间不要每 10 分钟追加一条评论（一天 144 条会埋掉真的更新）。
            // 同一 issue 上两条评论至少隔 1 小时。
            const COMMENT_THROTTLE_MS = 60 * 60 * 1000;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [label],
              per_page: 1,
            });

            const time = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = process.env.PROBE_REPORT || '(no report)';

            if (existing.data.length > 0) {
              const issue = existing.data[0];

              // sort/direction are explicit on purpose: the endpoint defaults to
              // created_at ASCENDING, so per_page=1 with no direction would
              // return the *oldest* comment and the throttle would never trip.
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                sort: 'created',
                direction: 'desc',
                per_page: 1,
              });
              const last = comments.data[0];
              const lastAt = last ? new Date(last.created_at).getTime() : 0;
              if (Date.now() - lastAt < COMMENT_THROTTLE_MS) {
                core.info(
                  `Issue #${issue.number} already commented within the last hour — skipping.`,
                );
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ 仍然不可达 — ${time}\n\n\`\`\`\n${report}\n\`\`\``,
              });
              core.info(`Commented on existing issue #${issue.number}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 站点探活失败 (${time.slice(0, 16)}Z)`,
              body: [
                '生产站点探活失败。各探针的原始结果：',
                '',
                '```',
                report,
                '```',
                '',
                `- Run：${runUrl}`,
                '',
                '排查顺序：Vercel 部署状态 → Cloudflare 边缘 → DNS。',
                '',
                '> 判据：只有连接失败（`000`）或 5xx 才算故障。',
                '> `403` 是 Cloudflare 挑战、`429` 是限流、`3xx` 是重定向，都不算。',
              ].join('\n'),
              labels: [label],
            });
            core.info(`Created issue #${issue.number}`);

      - name: Close issue if the site has recovered
        if: steps.probe.outputs.state == 'up'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'uptime';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [label],
              per_page: 1,
            });

            if (existing.data.length === 0) {
              core.info('Site is up and no open issue — nothing to do.');
              return;
            }

            const issue = existing.data[0];
            const time = new Date().toISOString();
            const report = process.env.PROBE_REPORT || '(no report)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ 站点已恢复 — ${time}\n\n\`\`\`\n${report}\n\`\`\``,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });
            core.info(`Closed issue #${issue.number}`);
