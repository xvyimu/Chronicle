# pnpm v11 settings.
# https://pnpm.io/settings

overrides:
  # GHSA-r28c-9q8g-f849 postcss (via next). 用范围而非精确钉：精确钉会随 advisory
  # 推进而变成「stale pin」，把包反向摁在漏洞版本上（2026-08-03 实测 8.5.15 中招）。
  postcss: '>=8.5.18'
  # prod 树里 postcss@8.5.25 → nanoid，解析结果 3.3.16 仍低于 GHSA-2v37-7h3g-55p8
  # 的首个修复版（<3.3.18）。上限取 <4：下一行 js-yaml 的教训——4.x 是 major，
  # 不属「安全升级」范围，要抬必须单独立项评估。
  nanoid: '>=3.3.18 <4'
  # prod 树里 next@16.3.5 → styled-jsx → @babel/helper-compilation-targets → browserslist，
  # 解析结果 4.28.2 仍低于 GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g 的首个修复版 4.28.7。
  browserslist: '>=4.28.7 <5'
  # GHSA-w5vr-8v7q-w6rv（moderate，DoS；vulnerable >=2.0.0 <2.11.0）。next 直接声明
  # ^2.9.19、browserslist@4.29 声明 ^2.11.23，不抬则 lock 里同时存在两份（2.10.38
  # 与 2.11.25），其中 2.10.38 就是那条 moderate。抬到 >=2.11.0 让两边并到一份。
  baseline-browser-mapping: '>=2.11.0'
  qs: '6.15.2'
  tmp: '>=0.2.6'
  uuid: '>=11.1.1'
  # fast-uri host confusion / SSRF（经 stryker → ajv 传入，dev-only）。
  # 该包 2026-05 至 2026-09 累计 9 条 high，各线修复版逐条推进：
  #   2.x: 2.4.1 → 2.4.5 · 3.x: 3.1.1 → 3.1.6 · 4.x: 4.0.1 → 4.1.3
  # 4.x 线当前最后一条（GHSA-5jgf-p345-68v8 等四条，2026-09-02 发布）的修复版是 4.1.3。
  # 用范围而非精确钉：本仓通则，精确钉会随 advisory 推进变成 stale pin（2026-08-03 撞过）。
  # 注意：ajv@8 声明的范围是 ^3.0.1，这条 override 把它抬到 4.x —— 这是既有选择
  # （master 此前已是 >=4.1.2），非本次引入；lock 与测试均按 4.x 通过。
  fast-uri: '>=4.1.3'
  # GHSA-f88m-g3jw-g9cj sharp/libvips CVEs (via next)，外加 GHSA-rgj7-g3m4-5g8c
  # （vulnerable <0.35.4）。
  #
  # 2026-10-07 收紧 0.35.4 → 0.35.5：CVE-2026-96889「sharp：librsvg 依赖漏洞」
  # （vulnerable <0.35.5）。原写 >=0.35.4 会把解析结果摁在 0.35.4 —— 恰好落在
  # 新 advisory 的受影响区间里。next@16.3.8 的 optionalDependencies 仍声明
  # ^0.35.4，不会自己抬，故必须显式收紧。
  sharp: '>=0.35.5'
  # GHSA-68fv-2mgg-jv7q「source-map-js 经 source-map section offset 触发事件循环
  # DoS」（vulnerable >=1.0.0 <1.2.2）。链路：next → postcss → source-map-js。
  # postcss@8.5.28 声明 ^1.2.1，范围允许 1.2.2，故一条 override 即可收敛。
  # 2026-10-07 新增。
  source-map-js: '>=1.2.2'
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 brace-expansion DoS。
  # 每条大版本线的 first patched 各不相同，且**会随 advisory 推进**。
  # 2026-10-07 实测各线要求（`pnpm audit` 提取）：
  #   1.x → >=1.1.21 · >=4.0.0 → >=5.0.12
  #
  # 2026-10-07 订正：原注释写「npm 上 1.x 线最高只有 1.1.16，上游从未发布 1.1.17」，
  # **该判断已过期** —— 实测 `npm view brace-expansion versions` 1.x 已发到 **1.1.21**；
  # 且 1.1.21 仍是 CJS 默认可调用导出（`main: index.js` · `module.exports = expandTop`），
  # 故原「1.x → 5.x 会 expand is not a function」的顾虑**不适用于 1.x 线内升级**。
  # 于是 `brace-expansion@1` 不再是「结构性无解」，改为跟随 1.x 修复版；
  # 该路径仍全部来自 eslint / stryker 等 devDependencies，不进生产运行时。
  brace-expansion@1: '>=1.1.21 <2'
  brace-expansion@2: '>=2.1.3 <3'
  brace-expansion@3: '>=3.0.3 <4'
  brace-expansion@4: '>=5.0.12'
  brace-expansion@5: '>=5.0.12'
  # GHSA-... dot-prop 原型污染（vulnerable >=5.0.0 <5.1.1）。链路：
  # commitlint → compare-func@2.0.0（声明 `^5.1.0`，5.x 修复版在范围内）。
  # 2026-10-07 新增。
  dot-prop: '>=5.1.1 <6'

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
