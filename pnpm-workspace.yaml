# pnpm v11 settings.
# https://pnpm.io/settings

overrides:
  # GHSA-r28c-9q8g-f849 postcss (via next). 用范围而非精确钉：精确钉会随 advisory
  # 推进而变成「stale pin」，把包反向摁在漏洞版本上（2026-08-03 实测 8.5.15 中招）。
  postcss: '>=8.5.18'
  qs: '6.15.2'
  tmp: '>=0.2.6'
  uuid: '>=11.1.1'
  # GHSA-v2hh-gcrm-f6hx fast-uri host confusion (via stryker → ajv)
  fast-uri: '>=3.1.4'
  # GHSA-f88m-g3jw-g9cj sharp/libvips CVEs (via next)
  sharp: '>=0.35.0'
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 brace-expansion DoS。
  # 每条大版本线的 first patched 各不相同：1.x→1.1.17 · 2.x→2.1.3 · 3.x→3.0.3 · >=4.0.0→5.0.8
  #
  # DEFER（结构性无解）：brace-expansion@1 保留在 1.1.16。
  #   1) npm 上 1.x 线最高只有 1.1.16，上游从未发布 advisory 所要求的 1.1.17。
  #   2) 唯一消费者 minimatch@3.1.5 用 `var expand = require('brace-expansion')`，
  #      依赖默认可调用导出；而 5.x CJS 只导出 `exports.expand`，跨大版本重映射会
  #      运行时报 expand is not a function。故不可用 @1 → 5.x 绕过。
  #   3) 该路径全部来自 eslint / stryker 等 devDependencies，不进生产运行时；
  #      可接受判据 = `pnpm audit --prod` exit 0（CI 的 audit 门据此收敛到 --prod）。
  brace-expansion@1: '1.1.16'
  brace-expansion@2: '>=2.1.3 <3'
  brace-expansion@3: '>=3.0.3 <4'
  brace-expansion@4: '>=5.0.8'
  brace-expansion@5: '>=5.0.8'

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
